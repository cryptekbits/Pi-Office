name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            addin/package-lock.json
            companion/package-lock.json

      - name: Install add-in dependencies
        run: npm ci --prefix addin

      - name: Install companion dependencies
        run: npm ci --prefix companion

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

      - name: Validate manifests
        run: npm run validate:manifests

      - name: Office unit tests
        run: npm run test:office
