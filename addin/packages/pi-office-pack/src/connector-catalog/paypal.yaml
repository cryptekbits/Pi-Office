category: commerce
recommendedHosts:
  - word
  - excel
  - powerpoint
setupDifficulty: easy
catalogRevision: 2026-04-27
id: paypal
name: PayPal
vendor: PayPal
iconKey: paypal
maturity: beta
setupKind: remote_api_key
authMethod: api_key
transport: remote_http
readOnly: true
summary: Read PayPal transaction and payout context for finance reporting.
officeValue: Useful for payout summaries, payment investigations, and finance ops templates.
tags:
  - payments
  - finance
capabilityHints:
  - read transactions
  - inspect payouts
  - search payments
requirements: []
envHints:
  - key: PAYPAL_ACCESS_TOKEN
    label: PayPal access token
  - key: PAYPAL_CLIENT_ID
    label: PayPal client id
  - key: PAYPAL_CLIENT_SECRET
    label: PayPal client secret
readPolicy:
  mode: hard-read-only
  allowResources: true
  allowPrompts: false
  allowToolPatterns:
    - ^(get|list|search|find|read|fetch|query|retrieve|describe|preview|inspect|lookup|resolve|show|view|count|whoami|stat)
    - (^|_)(search|list|get|read|find|fetch|query|describe|inspect|preview|lookup|retrieve)(_|$)
  blockToolPatterns:
    - ^(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)
    - (^|_)(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)(_|$)
    - (^|_)(refund|capture|create|update|cancel)(_|$)
  allowPromptPatterns: []
  blockPromptPatterns:
    - .*
template:
  transport: remote_http
  url: https://mcp.sandbox.paypal.com/http
setupProfiles:
  - id: paypal-sandbox-http
    label: PayPal Sandbox
    description: PayPal sandbox MCP over HTTP for safe setup and testing.
    transport: remote_http
    setupKind: remote_api_key
    authMethod: bearer_token
    endpoint: https://mcp.sandbox.paypal.com/http
    credentialEnvKey: PAYPAL_ACCESS_TOKEN
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: true
    defaultWhenCompanionPresent: true
    privacyNotes:
      - Sandbox payment requests go to PayPal's sandbox MCP service.
    simpleFields:
      - Connector URL
      - Access token
    advancedFields:
      - HTTP headers
      - Environment-backed headers
      - Tool policy
    docsUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    endpointEvidenceUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    authEvidenceUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    checkedAt: 2026-04-27
    riskNotes:
      - Official remote MCP profile, but Pi-Office has not yet verified browser-direct CORS/OAuth compatibility for this
        endpoint.
    availability: available
    browserDirect: unknown
  - id: paypal-live-http
    label: PayPal Live
    description: Production PayPal MCP over HTTP.
    transport: remote_http
    setupKind: remote_api_key
    authMethod: bearer_token
    endpoint: https://mcp.paypal.com/http
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: false
    defaultWhenCompanionPresent: false
    privacyNotes:
      - Production payment requests go to PayPal's live MCP service.
    simpleFields:
      - Connector URL
      - Access token
    advancedFields:
      - HTTP headers
      - Environment-backed headers
      - Tool policy
    docsUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    endpointEvidenceUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    authEvidenceUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    checkedAt: 2026-04-27
    riskNotes:
      - Official remote MCP profile, but Pi-Office has not yet verified browser-direct CORS/OAuth compatibility for this
        endpoint.
    availability: available
    browserDirect: unknown
  - id: paypal-local-stdio
    label: Use local companion
    description: Local PayPal MCP package through the companion.
    transport: local_stdio
    setupKind: local_node
    authMethod: bearer_token
    command: npx
    args:
      - -y
      - "@paypal/mcp"
      - --tools=all
    credentialEnvKey: PAYPAL_ACCESS_TOKEN
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: false
    defaultWhenCompanionPresent: false
    privacyNotes:
      - Local command output and tool results are sent back to the active Pi-Office session.
    simpleFields:
      - Local companion
      - Launch command
      - Access token
    advancedFields:
      - Arguments
      - Working directory
      - Environment variables
      - Tool policy
    docsUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    endpointEvidenceUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    authEvidenceUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
    checkedAt: 2026-04-27
    riskNotes:
      - Official local MCP profile, but it requires the Pi-Office companion because browsers cannot launch STDIO
        commands.
    availability: needs_companion
    browserDirect: unsupported
docsUrl: https://docs.paypal.ai/developer/tools/ai/mcp-quickstart
authUrl: https://developer.paypal.com/dashboard
