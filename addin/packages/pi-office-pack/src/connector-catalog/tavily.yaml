category: research
recommendedHosts:
  - word
  - excel
  - powerpoint
setupDifficulty: easy
catalogRevision: 2026-04-27
id: tavily
name: Tavily
vendor: Tavily
iconKey: tavily
maturity: beta
setupKind: remote_api_key
authMethod: api_key
transport: remote_http
readOnly: true
summary: Use Tavily-backed search for fast research and fresh web retrieval.
officeValue: Great for cited background research in briefs, decks, and customer-facing docs.
tags:
  - web
  - search
  - research
capabilityHints:
  - web search
  - fetch results
requirements: []
envHints:
  - key: TAVILY_API_KEY
    label: Tavily API key
readPolicy:
  mode: hard-read-only
  allowResources: true
  allowPrompts: false
  allowToolPatterns:
    - ^(get|list|search|find|read|fetch|query|retrieve|describe|preview|inspect|lookup|resolve|show|view|count|whoami|stat)
    - (^|_)(search|list|get|read|find|fetch|query|describe|inspect|preview|lookup|retrieve)(_|$)
  blockToolPatterns:
    - ^(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)
    - (^|_)(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)(_|$)
    - (^|_)(crawl)(_|$)
  allowPromptPatterns: []
  blockPromptPatterns:
    - .*
template:
  transport: remote_http
  url: https://mcp.tavily.com/mcp/
setupProfiles:
  - id: tavily-hosted
    label: Connect Tavily online
    description: Official hosted Tavily MCP with API-key auth.
    transport: remote_http
    setupKind: remote_api_key
    authMethod: api_key
    endpoint: https://mcp.tavily.com/mcp/
    credentialEnvKey: TAVILY_API_KEY
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: true
    defaultWhenCompanionPresent: true
    privacyNotes:
      - Search queries, URLs, and included Office text go to Tavily.
    simpleFields:
      - Connector URL
      - API key
    advancedFields:
      - HTTP headers
      - Environment-backed headers
      - Tool policy
    docsUrl: https://docs.tavily.com/documentation/mcp
    endpointEvidenceUrl: https://docs.tavily.com/documentation/mcp
    authEvidenceUrl: https://docs.tavily.com/documentation/mcp
    checkedAt: 2026-04-27
    riskNotes:
      - Official remote MCP profile, but Pi-Office has not yet verified browser-direct CORS/OAuth compatibility for this
        endpoint.
    availability: available
    browserDirect: unknown
  - id: tavily-local-stdio
    label: Use local companion
    description: Official Tavily MCP package through the companion.
    transport: local_stdio
    setupKind: local_node
    authMethod: api_key
    command: npx
    args:
      - -y
      - tavily-mcp@latest
    credentialEnvKey: TAVILY_API_KEY
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: false
    defaultWhenCompanionPresent: false
    privacyNotes:
      - Local command output and tool results are sent back to the active Pi-Office session.
    simpleFields:
      - Local companion
      - Launch command
      - API key
    advancedFields:
      - Arguments
      - Working directory
      - Environment variables
      - Tool policy
    docsUrl: https://docs.tavily.com/documentation/mcp
    endpointEvidenceUrl: https://docs.tavily.com/documentation/mcp
    authEvidenceUrl: https://docs.tavily.com/documentation/mcp
    checkedAt: 2026-04-27
    riskNotes:
      - Official local MCP profile, but it requires the Pi-Office companion because browsers cannot launch STDIO
        commands.
    availability: needs_companion
    browserDirect: unsupported
docsUrl: https://docs.tavily.com/documentation/mcp
