category: engineering
recommendedHosts:
  - word
  - excel
  - powerpoint
setupDifficulty: easy
catalogRevision: 2026-04-27
id: github
name: GitHub
vendor: GitHub
iconKey: github
maturity: ready
setupKind: remote_url_token
authMethod: bearer_token
transport: remote_http
readOnly: true
summary: Read repositories, issues, pull requests, and discussions from GitHub.
officeValue: Excellent for release notes, engineering reviews, and product updates assembled inside Office.
tags:
  - code
  - issues
  - pull-requests
capabilityHints:
  - read repo files
  - list PRs
  - search issues
requirements:
  - key: node
    label: Node.js
  - key: npx
    label: npx
envHints:
  - key: GITHUB_PERSONAL_ACCESS_TOKEN
    label: GitHub personal access token
    description: Classic or fine-grained token with read scopes only when possible.
readPolicy:
  mode: hard-read-only
  allowResources: true
  allowPrompts: false
  allowToolPatterns:
    - ^(get|list|search|find|read|fetch|query|retrieve|describe|preview|inspect|lookup|resolve|show|view|count|whoami|stat)
    - (^|_)(search|list|get|read|find|fetch|query|describe|inspect|preview|lookup|retrieve)(_|$)
  blockToolPatterns:
    - ^(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)
    - (^|_)(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)(_|$)
    - (^|_)(create_issue|create_pull|merge|close_pull|update|delete|comment|review|push)(_|$)
  allowPromptPatterns: []
  blockPromptPatterns:
    - .*
template:
  transport: remote_http
  url: https://api.githubcopilot.com/mcp/readonly
setupProfiles:
  - id: github-hosted-readonly
    label: Connect GitHub online
    description: Official GitHub hosted MCP read-only endpoint.
    transport: remote_http
    setupKind: remote_api_key
    authMethod: bearer_token
    endpoint: https://api.githubcopilot.com/mcp/readonly
    credentialEnvKey: GITHUB_PERSONAL_ACCESS_TOKEN
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: true
    defaultWhenCompanionPresent: true
    privacyNotes:
      - Repository and issue requests go to GitHub's hosted MCP/Copilot infrastructure.
    simpleFields:
      - Connector URL
      - Access token
    advancedFields:
      - HTTP headers
      - Environment-backed headers
      - Tool policy
    docsUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    endpointEvidenceUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    authEvidenceUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    checkedAt: 2026-04-27
    riskNotes:
      - Official remote MCP profile, but Pi-Office has not yet verified browser-direct CORS/OAuth compatibility for this
        endpoint.
    availability: available
    browserDirect: unknown
  - id: github-local-stdio
    label: Use local companion
    description: Official GitHub MCP server through Docker/binary/npx-compatible local launch.
    transport: local_stdio
    setupKind: local_node
    authMethod: bearer_token
    command: github-mcp-server
    args:
      - stdio
      - --read-only
    credentialEnvKey: GITHUB_PERSONAL_ACCESS_TOKEN
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: false
    defaultWhenCompanionPresent: false
    privacyNotes:
      - Local command output and tool results are sent back to the active Pi-Office session.
    simpleFields:
      - Local companion
      - Launch command
      - Access token
    advancedFields:
      - Arguments
      - Working directory
      - Environment variables
      - Tool policy
    docsUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    endpointEvidenceUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    authEvidenceUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    checkedAt: 2026-04-27
    riskNotes:
      - Official local MCP profile, but it requires the Pi-Office companion because browsers cannot launch STDIO
        commands.
    availability: needs_companion
    browserDirect: unsupported
  - id: github-local-http
    label: Local HTTP server
    description: Advanced local GitHub MCP HTTP endpoint.
    transport: remote_http
    setupKind: remote_api_key
    authMethod: bearer_token
    endpoint: http://127.0.0.1:8082
    credentialEnvKey: GITHUB_PERSONAL_ACCESS_TOKEN
    requiresCompanion: true
    officialness: official
    defaultWhenCompanionAbsent: false
    defaultWhenCompanionPresent: false
    privacyNotes:
      - Connector requests are made by the companion to the hosted MCP service.
    simpleFields:
      - Connector URL
      - Access token
    advancedFields:
      - HTTP headers
      - Environment-backed headers
      - Tool policy
    docsUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    endpointEvidenceUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    authEvidenceUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
    checkedAt: 2026-04-27
    riskNotes:
      - Local HTTP MCP endpoints are treated like local runtime access and require the Pi-Office companion.
    availability: needs_companion
    browserDirect: unsupported
docsUrl: https://github.com/github/github-mcp-server/blob/main/docs/remote-server.md
authUrl: https://github.com/settings/tokens
setupNotes:
  - This is one of the most turnkey MCP setups for read-only knowledge access.
