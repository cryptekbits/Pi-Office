      DB_HOST: localhost
      DB_PORT: "5432"
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_SSL: "false"
    credentialEnvKey: DB_PASSWORD
    requiresCompanion: true
    officialness: provider_reference
    defaultWhenCompanionAbsent: false
    defaultWhenCompanionPresent: true
    privacyNotes:
      - Local command output and tool results are sent back to the active Pi-Office session.
    simpleFields:
      - Local companion
      - Launch command
      - API key
    advancedFields:
      - Arguments
      - Working directory
      - Environment variables
      - Tool policy
    docsUrl: https://github.com/hovecapital/read-only-postgres-mcp-server
    endpointEvidenceUrl: https://github.com/hovecapital/read-only-postgres-mcp-server
    checkedAt: 2026-04-27
    riskNotes:
      - Reference read-only database profile; still requires companion and must keep write/destructive SQL tools
        disabled.
    availability: needs_companion
    browserDirect: unsupported
    authEvidenceUrl: https://github.com/hovecapital/read-only-postgres-mcp-server
docsUrl: https://github.com/hovecapital/read-only-postgres-mcp-server
setupNotes:
  - This is a reference/community read-only Postgres MCP package, not a PostgreSQL vendor-official hosted connector.
