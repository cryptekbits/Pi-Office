category: data
recommendedHosts:
  - word
  - excel
  - powerpoint
setupDifficulty: guided
catalogRevision: 2026-04-27
id: postgresql-reader
name: PostgreSQL Reader
vendor: Community
iconKey: postgres
maturity: ready
setupKind: local_node
authMethod: api_key
transport: local_stdio
readOnly: true
summary: Run safe, read-only queries against Postgres data sources that back your reports and models.
officeValue: Very effective for pulling live numbers into tables, summaries, and decision docs.
tags:
  - sql
  - database
  - reporting
capabilityHints:
  - describe schema
  - run SELECT queries
  - inspect tables
requirements:
  - key: node
    label: Node.js
  - key: npx
    label: npx
envHints:
  - key: DB_PASSWORD
    label: Postgres password
  - key: DB_HOST
    label: Database host
  - key: DB_DATABASE
    label: Database name
  - key: DB_USERNAME
    label: Read-only username
readPolicy:
  mode: hard-read-only
  allowResources: true
  allowPrompts: false
  allowToolPatterns:
    - ^(get|list|search|find|read|fetch|query|retrieve|describe|preview|inspect|lookup|resolve|show|view|count|whoami|stat)
    - (^|_)(search|list|get|read|find|fetch|query|describe|inspect|preview|lookup|retrieve)(_|$)
  blockToolPatterns:
    - ^(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)
    - (^|_)(create|update|delete|remove|write|edit|insert|append|upload|post|put|patch|merge|commit|apply|send|message|reply|comment|close|reopen|archive|move|rename|grant|revoke|start|stop|restart|approve|reject|refund|charge|pay)(_|$)
    - (^|_)(insert|update|delete|alter|drop|truncate|grant|revoke)(_|$)
  allowPromptPatterns: []
  blockPromptPatterns:
    - .*
template:
  transport: local_stdio
  command: npx
  args:
    - -y
    - "@hovecapital/read-only-postgres-mcp-server"
  env:
    DB_HOST: localhost
    DB_PORT: "5432"
    DB_DATABASE: ${DB_DATABASE}
    DB_USERNAME: ${DB_USERNAME}
    DB_PASSWORD: ${DB_PASSWORD}
    DB_SSL: "false"
setupProfiles:
  - id: readonly-local-stdio
    label: Use local companion
    description: Active read-only PostgreSQL MCP package through the companion.
    transport: local_stdio
    setupKind: local_node
    authMethod: api_key
